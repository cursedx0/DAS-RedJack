plugins {
    alias(libs.plugins.android.application)
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

android {
    namespace 'com.example.entrega1'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.entrega1"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.preference
    implementation libs.work.runtime
    implementation libs.gms.play.services.maps
    implementation (libs.osmdroid.android){
        exclude group: 'com.j256.ormlite', module: 'ormlite-core'
    }
    implementation (libs.osmdroid.wms){
        exclude group: 'com.j256.ormlite', module: 'ormlite-core'
    }
    implementation (libs.osmdroid.mapsforge){
        exclude group: 'com.j256.ormlite', module: 'ormlite-core'
    }
    implementation (libs.osmdroid.geopackage) {
        exclude group: 'com.j256.ormlite', module: 'ormlite-core'
    }
    implementation (libs.json.simple) {//para jsons de llamadas http
        exclude group: 'junit', module: 'junit'}

    implementation libs.play.services.location

    implementation libs.glide
    annotationProcessor libs.compiler

    implementation libs.okhttp
}

secrets {
// Optionally specify a different file name containing your secrets.
// The plugin defaults to "local.properties"
    propertiesFileName = "secrets.properties"
// A properties file containing default secret values. This file can be
// checked in version control.
    defaultPropertiesFileName = "local.defaults.properties"
// Configure which keys should be ignored by the plugin by providing regular expressions.
// "sdk.dir" is ignored by default.
    ignoreList.add("keyToIgnore") // Ignore the key "keyToIgnore"
    ignoreList.add("sdk.*") // Ignore all keys matching the regexp
    "sdk.*"
}